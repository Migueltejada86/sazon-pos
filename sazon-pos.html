<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sazón · El Descanso</title>
  <style>
    :root {
      --orange: #f15a24;
      --orange-d: #d94b16;
      --orange-s: #ffe8de;
      --ink: #2b2b2b;
      --nav: #4a4a4a;
      --nav-2: #5a5a5a;
      --line: #e6e6e6;
      --bg: #f4f4f4;
      --panel: #ececec;
      --green: #7ed3a0;
      --green-d: #5bb882;
      --busy: #f3b54a;
      --closed: #ef6b6b;
      --blue: #4b6fff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: Inter, Segoe UI, Arial, sans-serif; color: var(--ink); background: #fff; }
    button { font-family: inherit; cursor: pointer; }
    .app { display: flex; flex-direction: column; height: 100%; min-width: 1100px; }

    /* TOP BAR */
    .topbar {
      height: 56px; display: flex; align-items: center; gap: 2px;
      padding: 0 10px 0 8px; border-bottom: 3px solid var(--orange); background: #fff; flex-shrink: 0;
    }
    .logo {
      width: 48px; height: 42px; background: var(--orange); color: #fff; border-radius: 6px;
      display: grid; place-items: center; font-weight: 800; letter-spacing: .5px; line-height: 1;
      font-size: 13px; margin-right: 4px;
    }
    .logo small { display: block; font-size: 9px; font-weight: 700; letter-spacing: 1px; }
    .icon-btn {
      width: 42px; height: 42px; border: 0; background: transparent; color: #555; border-radius: 6px;
      display: grid; place-items: center; position: relative;
    }
    .icon-btn:hover { background: #f3f3f3; }
    .icon-btn.active { background: var(--orange); color: #fff; }
    .icon-btn .dot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; background: var(--orange); border-radius: 50%; }
    .icon-btn.active .dot { background: #fff; }
    .spacer { flex: 1; }
    .plan {
      display: flex; align-items: center; gap: 6px; border: 1px solid #d7def8; background: #eef2ff;
      color: #3b4db7; padding: 7px 12px; border-radius: 8px; font-size: 12px; font-weight: 700;
    }
    .userbox, .ghost {
      display: flex; align-items: center; gap: 8px; border: 1px solid #ddd; background: #fff;
      padding: 5px 10px; border-radius: 8px; font-size: 12px; height: 38px;
    }
    .userbox .name { font-weight: 700; line-height: 1.1; }
    .userbox .role { color: #777; font-size: 11px; }
    .ghost { width: 38px; justify-content: center; padding: 0; }

    /* SUBNAV */
    .subnav { height: 40px; background: var(--nav); display: flex; align-items: stretch; flex-shrink: 0; color: #fff; }
    .subnav button {
      background: transparent; border: 0; color: #e9e9e9; padding: 0 18px; font-size: 13px;
    }
    .subnav button:hover { background: #3f3f3f; }
    .subnav button.on { background: #fff; color: var(--orange); font-weight: 700; }
    .subnav .plus { color: #9ad0ff; font-weight: 700; margin-left: 2px; }
    .cash-tabs { background: #3a3a3a; }
    .pill { background: #f3c14a; color: #4a3200; font-size: 11px; font-weight: 700; border-radius: 10px; padding: 2px 8px; margin-left: 8px; align-self: center; }

    /* WORKSPACE */
    .ws { flex: 1; display: grid; grid-template-columns: 1.35fr .85fr; min-height: 0; }
    .ws.full { grid-template-columns: 1fr; }
    .left { display: flex; flex-direction: column; min-width: 0; background: #fff; border-right: 1px solid var(--line); }
    .right { background: var(--panel); display: flex; flex-direction: column; min-width: 0; }
    .page-head {
      height: 48px; background: var(--nav); color: #fff; display: flex; align-items: center;
      justify-content: space-between; padding: 0 14px; flex-shrink: 0;
    }
    .page-head h1 { font-size: 16px; font-weight: 700; letter-spacing: .4px; }
    .row { display: flex; gap: 8px; align-items: center; }
    .btn {
      border: 0; border-radius: 6px; padding: 8px 12px; font-size: 13px; font-weight: 600;
    }
    .btn-dark { background: #2b2b2b; color: #fff; }
    .btn-dark:hover { background: #111; }
    .btn-light { background: #fff; color: #333; border: 1px solid #ddd; }
    .btn-orange { background: var(--orange); color: #fff; }
    .btn-orange:hover { background: var(--orange-d); }
    .btn-ghost { background: transparent; color: #666; border: 0; }

    .rooms {
      height: 42px; background: var(--nav-2); display: flex; align-items: flex-end; padding: 0 8px; gap: 4px; flex-shrink: 0;
    }
    .rooms button {
      background: #6a6a6a; color: #fff; border: 0; border-radius: 6px 6px 0 0; padding: 8px 14px; font-size: 13px;
    }
    .rooms button.on { background: #fff; color: #222; font-weight: 700; }
    .search-mini {
      margin-left: auto; background: #fff; border: 0; border-radius: 4px; padding: 6px 10px; width: 180px; font-size: 12px;
    }

    .canvas { flex: 1; overflow: auto; padding: 22px; background: #fff; }
    .tables { display: flex; flex-wrap: wrap; gap: 12px; max-width: 620px; }
    .table {
      width: 72px; height: 62px; border: 0; border-radius: 8px; background: var(--green); color: #1d4d33;
      font-size: 22px; font-weight: 700; box-shadow: 0 1px 0 rgba(0,0,0,.08);
    }
    .table:hover { filter: brightness(.96); }
    .table.busy { background: var(--busy); color: #5a3b00; }
    .table.closed { background: #f0a0a0; color: #5a1010; }
    .table.on { outline: 3px solid var(--orange); }
    .table.round { border-radius: 50%; width: 68px; height: 68px; }
    .table.edit { background: #8d8d8d; color: #fff; }
    .floor { display: grid; grid-template-columns: repeat(8, 84px); gap: 12px; align-items: start; }
    .floor-admin { background: linear-gradient(#ececec 1px, transparent 1px), linear-gradient(90deg, #ececec 1px, transparent 1px); background-size: 90px 90px; padding: 20px; min-height: 420px; }
    .room-edit-bar { display: flex; gap: 6px; align-items: center; padding: 10px 12px; background: #4a4a4a; }
    .room-edit-bar button { background: #5c5c5c; color: #fff; border: 0; border-radius: 6px; padding: 8px 12px; }
    .room-edit-bar button.on { background: #fff; color: #222; font-weight: 700; }
    .room-edit-bar .exit { background: var(--orange); }

    .empty-right {
      flex: 1; display: grid; place-items: center; color: #9a9a9a; font-size: 14px;
    }

    /* LISTS */
    .section { padding: 16px 18px 8px; font-size: 13px; font-weight: 700; color: #555; }
    table.grid { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.grid th { text-align: left; background: #f3f3f3; color: #666; font-weight: 600; padding: 8px 12px; }
    table.grid td { padding: 10px 12px; border-bottom: 1px solid #eee; }
    table.grid tr { cursor: pointer; }
    table.grid tr:hover td { background: #fafafa; }
    table.grid tr.on td { background: #fff4ef; }
    .stripe td { background: repeating-linear-gradient(135deg,#fff,#fff 8px,#f7f7f7 8px,#f7f7f7 16px); }
    .sideline { box-shadow: inset 4px 0 0 var(--closed); }
    .badge {
      display: inline-block; border: 1px solid var(--closed); color: var(--closed); border-radius: 4px;
      padding: 2px 8px; font-size: 12px;
    }
    .muted { color: #888; }

    /* EXPRESS */
    .toolbar { display: flex; gap: 10px; padding: 12px 16px; align-items: center; }
    .search {
      flex: 1; border: 1px solid #ddd; border-radius: 6px; padding: 10px 12px; font-size: 13px;
    }
    .cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 0 16px 12px; }
    .cat {
      background: #fff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 16px 10px; text-align: center;
      font-weight: 700; font-size: 13px; position: relative; overflow: hidden;
    }
    .cat:before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--c, #ccc); }
    .cat.on { background: #fff1ea; border-color: var(--orange); color: var(--orange); }
    .products { padding: 8px 16px 20px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .prod {
      border: 1px solid #e8e8e8; border-radius: 8px; padding: 12px; text-align: left; background: #fff;
      box-shadow: 0 1px 0 rgba(0,0,0,.04);
    }
    .prod .price { font-weight: 700; margin-top: 8px; }
    .prod .code { font-size: 11px; color: #888; }

    /* DETAIL / CART */
    .detail { display: flex; flex-direction: column; height: 100%; }
    .detail-h { padding: 14px 16px; border-bottom: 1px solid #ddd; font-weight: 700; }
    .cart { flex: 1; overflow: auto; padding: 12px 16px; }
    .line { display: grid; grid-template-columns: 36px 1fr auto; gap: 8px; align-items: start; padding: 8px 0; border-bottom: 1px solid #e8e8e8; }
    .note-in { width:100%; margin-top:4px; border:1px dashed #ccc; border-radius:4px; padding:5px 8px; font-size:12px; }
    .qty {
      width: 36px; height: 28px; border: 1px solid #ddd; border-radius: 4px; text-align: center;
    }
    .totals { padding: 12px 16px; background: #fff; border-top: 1px solid #ddd; }
    .totals div { display: flex; justify-content: space-between; margin: 4px 0; font-size: 13px; }
    .totals .grand { font-size: 20px; font-weight: 800; margin-top: 8px; }
    .paybar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px 16px 16px; background: #fff; }

    /* VENTAS */
    .filters { background: #efefef; padding: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
    select, input.field {
      border: 1px solid #ccc; background: #fff; border-radius: 4px; padding: 7px 8px; font-size: 12px;
    }
    .kpis { display: grid; grid-template-columns: 140px repeat(4, 1fr); border: 1px solid #e5e5e5; margin: 12px; }
    .kpi { padding: 12px; border-right: 1px solid #eee; min-height: 110px; }
    .kpi b { display: block; font-size: 22px; margin-top: 10px; }
    .kpi span { font-size: 12px; color: #666; }

    /* DELIVERY */
    .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 16px; height: 100%; }
    .col { background: #f7f7f7; border-radius: 8px; padding: 10px; overflow: auto; }
    .col h3 { font-size: 13px; margin-bottom: 10px; }
    .ticket { background: #fff; border-radius: 8px; padding: 10px; margin-bottom: 8px; border-left: 4px solid var(--orange); font-size: 12px; }
    .ticket b { display: block; margin-bottom: 4px; }

    /* RESERVAS */
    .res-hero { padding: 24px; display: grid; grid-template-columns: 1.1fr .9fr; gap: 20px; }
    .res-hero h2 { font-size: 28px; margin-bottom: 8px; }
    .res-hero p { color: #555; margin-bottom: 14px; }
    .feat { display: flex; gap: 8px; align-items: center; margin: 8px 0; font-size: 14px; }
    .price-lg { font-size: 28px; font-weight: 800; margin: 16px 0; }
    .res-table { margin: 0 24px 24px; }

    /* CONFIG */
    .cfg { display: grid; grid-template-columns: 260px 1fr; height: 100%; }
    .side {
      background: var(--nav); color: #fff; padding: 16px 0; overflow: auto;
    }
    .side h2 { font-size: 15px; padding: 0 16px 12px; }
    .side a, .side button.item {
      display: flex; gap: 10px; align-items: center; width: 100%; text-align: left;
      background: transparent; border: 0; color: #eee; padding: 10px 16px; font-size: 13px;
    }
    .side button.item:hover, .side button.item.on { background: #3a3a3a; }
    .side .group { padding: 8px 16px 4px; font-size: 11px; color: #bbb; text-transform: uppercase; letter-spacing: .4px; }
    .cfg-body { padding: 24px; overflow: auto; }
    .card { background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; padding: 18px; margin-bottom: 12px; }
    .switch { width: 40px; height: 22px; background: #ccc; border-radius: 11px; position: relative; border: 0; }
    .switch.on { background: var(--green-d); }
    .switch i { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; background: #fff; border-radius: 50%; transition: .15s; }
    .switch.on i { left: 20px; }

    .toast {
      position: fixed; bottom: 18px; right: 18px; background: #222; color: #fff; padding: 10px 14px;
      border-radius: 8px; font-size: 13px; display: none; z-index: 20;
    }
    .hidden { display: none !important; }
    .kds { background:#2a2a2a; height:100%; display:flex; flex-direction:column; color:#fff; }
    .kds-bar { display:flex; gap:8px; align-items:center; padding:10px 14px; background:#4a4a4a; }
    .kds-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; padding:16px; overflow:auto; flex:1; }
    .kds-card { background:#3a3a3a; border-radius:10px; padding:12px; border-top:4px solid #7ed3a0; }
    .kds-card.late { border-top-color:#f3b54a; }
    .kds-card.very { border-top-color:#ef6b6b; }
    .drawer { position:absolute; top:40px; right:0; bottom:0; width:340px; background:#fff; color:#222; z-index:8; box-shadow:-8px 0 24px rgba(0,0,0,.15); overflow:auto; }
    .chk { display:flex; justify-content:space-between; padding:10px 0; }
    .rep { display:grid; grid-template-columns:200px 1fr; height:100%; }
    .rep-side button.item.on { background:var(--orange); }
    .shop { background:#f6f1ea; height:100%; overflow:auto; }
    .shop-hero { height:160px; background:linear-gradient(#8b1e1e,#c43c3c); color:#fff; padding:18px 24px; }
    .shop-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; padding:20px; }
    .shop-card { background:#fff; border-radius:10px; overflow:hidden; }
    .shop-card img, .ph { height:110px; background:#e8d7c8; display:grid; place-items:center; font-size:32px; }
    .shop-card .b { padding:10px; }
    .price-old { text-decoration:line-through; color:#999; font-size:12px; }
    .joined { outline:3px dashed #fff; }
    .pay-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:10px 14px; }
    .pay-grid button { border:1px solid #ddd; background:#fff; border-radius:8px; padding:12px; font-weight:700; }
    .pay-grid button.on { border-color:var(--orange); background:#fff3ee; color:var(--orange); }
    .mozo-app { display:none; flex-direction:column; height:100%; background:#0f1728; }
    .mozo-app.show { display:flex; }
    .app.hide { display:none; }
    .mozo-top { background:#0f1728; color:#fff; padding:10px 12px; display:flex; align-items:center; gap:10px; }
    .mozo-top h1 { font-size:18px; flex:1; }
    .mozo-rooms { display:flex; gap:6px; overflow:auto; padding:8px 12px; background:#fff; }
    .mozo-rooms button { border:0; background:#eee; border-radius:16px; padding:6px 12px; white-space:nowrap; }
    .mozo-rooms button.on { background:var(--orange); color:#fff; }
    .mozo-list { flex:1; overflow:auto; background:#fff; display:flex; }
    .mozo-nums { width:64px; background:#f3f3f3; }
    .mozo-nums button { display:block; width:100%; border:0; background:#cfe8cf; padding:10px; font-weight:800; border-bottom:1px solid #fff; }
    .mozo-nums button.on { outline:3px solid #e8a317; }
    .mozo-body { flex:1; padding:12px; }
    .mozo-fab { position:fixed; right:16px; bottom:16px; background:var(--orange); color:#fff; border:0; border-radius:24px; padding:14px 18px; font-weight:800; z-index:20; }
    .arqueo-box { max-width:560px; }
    .arqueo-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #eee; }
    .arqueo-row input { width:140px; text-align:right; padding:6px 8px; border:1px solid #ddd; border-radius:6px; }
    .diff-ok { color:#157347; font-weight:800; }
    .diff-bad { color:#b42318; font-weight:800; }
    .warn-open { background:#fff3cd; border:1px solid #f0c36d; padding:12px; border-radius:8px; margin:10px 0; }
    .ticket80 { width:72mm; font-family:"Courier New",monospace; font-size:12px; color:#000; }
    .ticket80 h3 { text-align:center; margin:4px 0; }
    .ticket80 .dash { border-top:1px dashed #000; margin:6px 0; }
    @media print {
      body * { visibility:hidden; }
      #ticketPrint, #ticketPrint * { visibility:visible; }
      #ticketPrint { position:absolute; left:0; top:0; width:72mm; }
    }
    @media (max-width:820px){
      .app { min-width:0; }
      .topbar { display:none; }
      .subnav { display:none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="logo">SZ<small>SAZÓN</small></div>
      <button class="icon-btn active" data-mod="pos" title="Punto de venta" onclick="go('pos','mesas')">
        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 18V8l6-4 6 4v10"/><path d="M9 18v-6h4v6"/></svg>
      </button>
      <button class="icon-btn" data-mod="stats" title="Reportes" onclick="go('stats','ventas')">
        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 16l4-4 3 3 7-8"/><path d="M4 18h14"/></svg>
      </button>
      <button class="icon-btn" data-mod="gastos" title="Gastos" onclick="go('gastos','lista')">
        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="14" height="13" rx="2"/><path d="M8 9h6M8 12h6M8 15h3"/></svg>
      </button>
      <button class="icon-btn" data-mod="finanzas" title="Finanzas" onclick="go('finanzas','cobrar')">
        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M8 9h5M8 13h6M11 7v10"/></svg>
      </button>
      <button class="icon-btn" data-mod="catalogo" title="Productos" onclick="go('catalogo','productos')">
        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h14l-1 11H5L4 7z"/><path d="M8 7V5h6v2"/></svg>
      </button>
      <button class="icon-btn" data-mod="clientes" title="Clientes" onclick="go('clientes','lista')">
        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="8" r="3"/><path d="M5 18c1.5-3 3.5-4 6-4s4.5 1 6 4"/></svg>
      </button>
      <button class="icon-btn" data-mod="prov" title="Proveedores" onclick="go('prov','lista')">
        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="10" width="11" height="7" rx="1"/><path d="M14 13h4l2 3v1h-6"/><circle cx="7" cy="18" r="1.5"/><circle cx="17" cy="18" r="1.5"/></svg>
      </button>
      <button class="icon-btn" data-mod="kds" title="Cocina" onclick="go('kds','kds')">
        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="16" height="12" rx="2"/><path d="M3 9h16"/></svg>
      </button>
      <button class="icon-btn" data-mod="pagos" title="Pagos" onclick="go('pagos','cobros')">
        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="3" width="10" height="16" rx="2"/><path d="M9 16h4"/></svg>
        <span class="dot"></span>
      </button>
      <button class="icon-btn" data-mod="config" title="Configuración" onclick="go('config','whatsapp')">
        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="3"/><path d="M11 3v2M11 17v2M3 11h2M17 11h2M5.2 5.2l1.4 1.4M15.4 15.4l1.4 1.4M5.2 16.8l1.4-1.4M15.4 6.6l1.4-1.4"/></svg>
      </button>
      <div class="spacer"></div>
      <div class="plan">★ AVANZADO</div>
      <div class="userbox">
        <svg width="16" height="16" fill="none" stroke="#555" stroke-width="1.8"><circle cx="8" cy="6" r="2.4"/><path d="M3 13c1-2 2.4-3 5-3s4 1 5 3"/></svg>
        <div><div class="name">El Descanso</div><div class="role">admin</div></div>
      </div>
      <button class="ghost" onclick="toast('Sin mensajes nuevos')">✉</button>
      <button class="ghost" onclick="abrirMozo()" title="App mozo">📱</button>
      <button class="ghost" onclick="toast('Ayuda de Sazón POS')">?</button>
    </header>

    <nav class="subnav" id="subnav"></nav>

    <main class="ws" id="ws">
      <section class="left" id="left"></section>
      <aside class="right" id="right"></aside>
    </main>
  </div>
  <div class="mozo-app" id="mozoApp"></div>
  <div id="ticketPrint" class="ticket80" style="display:none"></div>
  <div class="toast" id="toast"></div>

  <script>
    const state = {
      module: "pos",
      tab: "mesas",
      room: "Galeria",
      table: null,
      order: null,
      cat: "Favoritos",
      cart: [],
      cfg: "whatsapp",
      configTab: "general",
      selTable: null,
      joinSel: [],
      pending: [],
      mesaMeta: {pers:1, cliente:"", mozo:"", nota:""},
      mesaAbierta: false,
      payMedio: "Efectivo",
      view: "caja",
      kdsOpen: true,
      kdsF: {
        cmd: {tiempo:1, demo:1, muy:1},
        prep: {pend:1, prep:1, term:1},
        origen: {mesas:1, delivery:1, mostrador:1},
        cocina: {barra:1, cocina:1, sin:1},
        cerradas:0, enteras:0
      },
    };

    /* Mapas reales de El Descanso extraídos de las capturas */

    function tableBtn(t, mode){
      const joined = (t.group||"").length;
      const selj = state.joinSel.includes(t.n);
      const cls = ["table", t.s==="rd"?"round":"", mode==="edit"?"edit":"", busy[t.n]&&mode!=="edit"?"busy":"", state.table===t.n?"on":"", joined||selj?"joined":""].join(" ");
      const label = t.group ? t.group : t.n;
      return `<button class="${cls}" draggable="true" style="grid-column:${t.c};grid-row:${t.r}"
        ondragstart="dragStart(${t.n})"
        ondragover="event.preventDefault()"
        ondrop="dropOn(${t.n})"
        onclick="modeClick('${mode}',${t.n})">${label}</button>`;
    }
    function modeClick(mode, n){
      if(mode==="edit"){ state.selTable=n; if(!state.joinSel.includes(n)) state.joinSel.push(n); else state.joinSel=state.joinSel.filter(x=>x!==n); render(); }
      else openTable(n);
    }
    let dragN=null;
    function dragStart(n){ dragN=n; }
    function dropOn(n){
      if(dragN==null || dragN===n) return;
      const a = rooms[state.room].tables.find(x=>x.n===dragN);
      const b = rooms[state.room].tables.find(x=>x.n===n);
      if(a && b){ const r=a.r,c=a.c; a.r=b.r; a.c=b.c; b.r=r; b.c=c; }
      dragN=null; render();
    }
    function nudge(dir){
      const t = rooms[state.room].tables.find(x=>x.n===state.selTable);
      if(!t) return;
      if(dir==="l") t.c=Math.max(1,t.c-1);
      if(dir==="r") t.c=Math.min(8,t.c+1);
      if(dir==="u") t.r=Math.max(1,t.r-1);
      if(dir==="d") t.r=Math.min(8,t.r+1);
      render();
    }
    function juntarMesas(){
      if(state.joinSel.length<2){ toast("Elegí 2 o más mesas para juntar"); return; }
      const g = state.joinSel.sort((a,b)=>a-b).join("+");
      rooms[state.room].tables.forEach(t=>{ if(state.joinSel.includes(t.n)) t.group=g; });
      toast("Mesas juntas para el evento: "+g);
      state.joinSel=[]; render();
    }
    function separarMesas(){
      rooms[state.room].tables.forEach(t=>{ if(state.joinSel.includes(t.n) || t.n===state.selTable) t.group=""; });
      state.joinSel=[]; toast("Mesas separadas"); render();
    }

    function renderMesas(){
      const room = rooms[state.room];
      $("left").innerHTML = `
        <div class="rooms">
          ${Object.keys(rooms).map(r=>`<button class="${state.room===r?"on":""}" onclick="state.room='${r}';state.table=null;render()">${r}</button>`).join("")}

        </div>
        <div class="canvas" ondragover="event.preventDefault()">
          <div class="row" style="margin-bottom:10px">

            <span class="muted">Arrastrá mesas en Configuración → Salas. Juntá mesas para un evento.</span>
          </div>
          <div class="floor">${room.tables.map(t=>tableBtn(t,"pos")).join("")}</div>
        </div>`;

        $("right").innerHTML = `<div class="empty-right">&lt; Selecciona una mesa</div>`;

    function findTable(n){
      for(const [name, room] of Object.entries(rooms)){
        if(room.tables.some(t=>t.n===n)) return name;
      }
    }

    function openTable(n){
      const sala = findTable(n);
      if(sala) state.room = sala;
      state.table = n;
      state.order = {tipo:"mesa", ref:"Mesa "+n};
      state.mesaAbierta = !!busy[n] || state.mesaAbierta && state.table===n;
      if(!busy[n]) { state.mesaAbierta = false; state.cart=[]; state.pending=[]; }
      render();
    }
    function abrirMesa(){
      if(!caja.abierta){ toast("Caja cerrada. Abrí el turno primero."); return; }
      if(!state.table) return;
      busy[state.table] = true;
      state.mesaAbierta = true;
      mesasOpen[state.table] = {meta:{...state.mesaMeta}, cart:[], pending:[]};
      saveDB();
      toast("Mesa "+state.table+" abierta · "+state.mesaMeta.pers+" pers.");
      render();
    }

    function pedirCierre(){
      const abiertas = mesasAbiertasList();
      if(abiertas.length){
        toast("No se puede cerrar: mesas abiertas "+abiertas.join(", "));
        go("ventas","arqueo");
        return;
      }
      if(!caja.abierta){ toast("La caja ya está cerrada"); go("ventas","arqueo"); return; }
      state.tab = "arqueo";
      state.arqueoStep = "contar";
      state.efectivoContado = esperadoEfectivo();
      render();
    }
    function confirmarCierreNoche(){
      const abiertas = mesasAbiertasList();
      if(abiertas.length){ toast("Siguen mesas abiertas: "+abiertas.join(", ")); return; }
      const pm = porMedio(caja.ventasNoche);
      const tot = caja.ventasNoche.reduce((s,v)=>s+v.total,0);
      const esperado = esperadoEfectivo();
      const contado = +state.efectivoContado || 0;
      const dif = contado - esperado;
      const arqueo = {
        fecha: new Date().toLocaleString("es-AR"),
        cant: caja.ventasNoche.length,
        total: tot,
        medios: pm,
        fondo: caja.fondo||0,
        ingresos: sumaMov("ingreso"),
        retiros: sumaMov("retiro"),
        esperadoEfectivo: esperado,
        contado,
        diferencia: dif,
        usuario: "admin",
        ventas: caja.ventasNoche.slice()
      };
      caja.arqueos.unshift(arqueo);
      caja.ventasNoche = [];
      caja.movimientos = [];
      caja.fondo = 0;
      caja.abierta = false;
      caja.cerradaEn = new Date().toISOString();
      state.arqueoStep = null;
      saveDB();
      imprimirCierre(arqueo);
      toast((dif===0?"Caja cuadrada":"Caja con diferencia "+money(dif))+" · turno cerrado");
      go("ventas","arqueo");
    }
    function abrirCajaManana(){
      const fondo = +prompt("Fondo inicial en efectivo (mañana)", String(caja.fondo||0));
      if(Number.isNaN(fondo) || fondo<0){ toast("Fondo inválido"); return; }
      caja.abierta = true;
      caja.abiertaEn = new Date().toISOString();
      caja.fondo = fondo;
      caja.ventasNoche = [];
      caja.movimientos = [];
      saveDB();
      toast("Caja abierta · fondo "+money(fondo));
      go("ventas","arqueo");
    }
    function nuevoMovimiento(){
      if(!caja.abierta){ toast("Abrí la caja primero"); return; }
      const tipo = prompt("Tipo: ingreso o retiro","retiro");
      if(tipo!=="ingreso" && tipo!=="retiro") return;
      const monto = +prompt("Monto", "0");
      if(!monto) return;
      const comentario = prompt("Comentario", tipo==="retiro"?"Retiro noche":"Ingreso")||"";
      caja.movimientos.push({
        fecha: new Date().toLocaleString("es-AR"),
        tipo, monto, comentario, caja:"Caja 1"
      });
      saveDB();
      toast((tipo==="retiro"?"Retiro":"Ingreso")+" "+money(monto));
      render();
    }

              <button class="btn btn-light" onclick='addProd(${JSON.stringify(p)});renderMozo()'>+</button>
            </div>`).join("")}
            ${(state.pending.length||state.cart.length)?`<div class="card"><b>Pedido</b>
              ${state.pending.map((x,i)=>`<div class="line" style="grid-template-columns:1fr auto"><div>${x.q} ${x.n}<div class="muted">${x.note||"sin comentario"}</div></div><button class="btn btn-light" onclick="notaItem('pending',${i});renderMozo()">Nota</button></div>`).join("")}
              ${state.cart.map((x,i)=>`<div class="line" style="grid-template-columns:1fr auto"><div>${x.q} ${x.n}<div class="muted">${x.note||"sin comentario"}</div></div><button class="btn btn-light" onclick="notaItem('cart',${i});renderMozo()">Nota</button></div>`).join("")}
            </div>`:""}
          </div>
          <button class="mozo-fab" onclick="if(state.pending.length)confirmPending();toast(state.cart.length+' ítems');renderMozo()">Continuar ${state.pending.length+state.cart.length}</button>
        `}
      `;

    function renderOpenMesa(){
      const m = state.mesaMeta;
      $("right").innerHTML = `<div class="detail">
        <div class="detail-h" style="background:#cfe8cf;color:#145214">MESA ${state.table}<div class="muted">Libre</div></div>
        <div class="cart">
          <label class="muted">Personas *</label>

            <input class="qty" value="${m.pers}" onchange="state.mesaMeta.pers=+this.value||1" />
            <button class="btn btn-light" onclick="state.mesaMeta.pers++;render()">+</button></div>
          <label class="muted">Camarero</label><input class="field" value="${m.mozo}" oninput="state.mesaMeta.mozo=this.value" placeholder="Natalia" />
          <label class="muted">Cliente</label><input class="field" value="${m.cliente}" oninput="state.mesaMeta.cliente=this.value" />
          <label class="muted">Comentario</label><textarea class="field" oninput="state.mesaMeta.nota=this.value">${m.nota}</textarea>
        </div>
        <div class="paybar"><button class="btn btn-orange" onclick="abrirMesa()">Abrir mesa</button></div>
      </div>`;

    function renderMostrador(){
      $("left").innerHTML = `

          <h1>MOSTRADOR</h1>
          <div class="row">
            <button class="btn btn-light" onclick="go('shop','shop')">Crea tu tienda online</button>

          <tr><th>ID</th><th>Hora Inicio</th><th>Estado</th><th>Cliente</th><th>Total</th></tr>
          ${orders.map(o=>`<tr class="sideline ${state.order&&state.order.id===o.id?"on":""}" onclick="openOrder(${o.id})">
            <td><b>${o.id}</b></td><td>${o.start}</td><td><span class="badge">${o.status}</span></td>
            <td>${o.client||""}</td><td>${money(o.total)}</td></tr>`).join("")}

          ${closed.map(o=>`<tr class="stripe"><td>${o.id}</td><td>${o.start}</td><td class="muted">${o.status}</td><td></td><td>${money(o.total)}</td></tr>`).join("")}

    function nuevoPedido(tipo){
      const id = 4000 + orders.length;
      const now = new Date();
      const start = now.toLocaleDateString("es-AR") + " " + now.toLocaleTimeString("es-AR");
      const o = {id, start, status:"En curso", client:"", total:0, type:tipo};
      orders.unshift(o);
      state.order = o;
      state.cart = [];
      toast("Pedido " + id + " creado");
      render();
    }
    function openOrder(id){
      state.order = orders.find(o=>o.id===id);
      render();
    }

    function renderExpress(){
      const items = products[state.cat] || [];
      $("left").innerHTML = `
        <div class="page-head">
          <div class="row">
            <button class="btn ${!state._hist?"btn-light":""}" style="${!state._hist?"background:#fff;color:#333":""}" onclick="state._hist=false;render()">Pedidos</button>
            <button class="btn ${state._hist?"btn-light":"btn-ghost"}" style="color:#fff" onclick="state._hist=true;render()">Historial</button>
          </div>
          <button class="btn btn-dark" onclick="nuevoPedido('express')">+ Nuevo Pedido</button>
        </div>
        <div class="toolbar">
          <input class="search" placeholder="Buscar producto o código" oninput="filterProd(this.value)" />
          <button class="btn btn-ghost" onclick="toast('Configurar vista')">⚙ Configurar vista</button>
        </div>
        <div class="cats">
          ${Object.keys(products).map(c=>`<button class="cat ${state.cat===c?"on":""}" style="--c:${catColor[c]}" onclick="state.cat='${c}';render()">${c}</button>`).join("")}
        </div>
        <div style="padding:0 16px 8px;color:#4b6fff;font-size:13px">Ver más</div>
        <div class="products" id="prodgrid">
          ${items.map(p=>`<button class="prod" onclick='addProd(${JSON.stringify(p)})'><div>${p.n}</div><div class="price">${money(p.p)}</div><div class="code">${p.c}</div></button>`).join("")}
        </div>`;
      if(!state.order && !state.cart.length) $("right").innerHTML = `<div class="empty-right">&lt; Crear un nuevo pedido</div>`;
      else renderOrderPanel(state.order ? "Pedido "+state.order.id : "Nuevo pedido");
    }

    function addProd(p){
      if(!state.order) nuevoPedido(state.tab==="express"?"express":"mesa");
      const dest = (state.tab==="mesas" && state.mesaAbierta) ? state.pending : state.cart;
      const last = [...dest].reverse().find(x=>x.c===p.c && !x.note);
      if(last) last.q++;
      else dest.push({...p, q:1, note:""});
      if(dest!==state.pending) syncTotal();
      render();
    }
    function setItemQty(lista, i, q){
      const arr = lista==="pending" ? state.pending : state.cart;
      if(!arr[i]) return;
      arr[i].q = Math.max(0, +q);
      if(arr[i].q<=0) arr.splice(i,1);
      if(lista!=="pending") syncTotal();
      render();
    }
    function setItemNote(lista, i, txt){
      const arr = lista==="pending" ? state.pending : state.cart;
      if(!arr[i]) return;
      arr[i].note = txt;
    }
    function notaItem(lista, i){
      const arr = lista==="pending" ? state.pending : state.cart;
      if(!arr[i]) return;
      const v = prompt("Comentario para cocina / ticket", arr[i].note||"");
      if(v===null) return;
      arr[i].note = v.trim();
      render();
    }
    function confirmPending(){
      state.pending.forEach(p=>{
        const f = state.cart.find(x=>x.c===p.c && x.note===p.note);
        if(f) f.q += p.q; else state.cart.push({...p});
      });
      state.pending = [];
      syncTotal();
      toast("Comanda confirmada");
      render();
    }
    function searchAdd(q){
      q = (q||"").toLowerCase().trim();
      if(!q) return;
      const hit = allProds.find(p => p.c.toLowerCase()===q || p.n.toLowerCase().includes(q));
      if(hit) addProd(hit);
      else toast("Sin coincidencias");
    }
    function setQty(c,q){
      const it = state.cart.find(x=>x.c===c);
      if(!it) return;
      it.q = Math.max(0, +q);
      state.cart = state.cart.filter(x=>x.q>0);
      syncTotal(); render();
    }
    function syncTotal(){
      const t = state.cart.reduce((s,x)=>s+x.p*x.q,0);
      if(state.order) state.order.total = t;
    }
    function cobrarr(){
      if(!caja.abierta){ toast("Caja cerrada. Abrí el turno de la mañana."); return; }
      if(!state.cart.length && !state.pending.length){ toast("El pedido está vacío"); return; }
      if(state.pending.length) confirmPending();
      const total = state.cart.reduce((s,x)=>s+x.p*x.q,0);
      const venta = {
        id: Date.now()%100000,
        mesa: state.table,
        items: state.cart.map(x=>({n:x.n,q:x.q,p:x.p,note:x.note||""})),
        total, medio: state.payMedio||"Efectivo",
        mozo: state.mesaMeta.mozo||"admin",
        pers: state.mesaMeta.pers||1,
        start: new Date().toLocaleString("es-AR"),
        status:"Cerrada"
      };
      ventasLog.unshift(venta);
      caja.ventasNoche.push(venta);
      if(state.order){ state.order.status="Cerrada"; state.order.total=total; closed.unshift({...state.order, status:"Cerrada"}); orders = orders.filter(o=>o.id!==state.order.id); }
      if(state.table){ delete busy[state.table]; delete mesasOpen[state.table]; }
      imprimirTicket(venta);
      toast("Ticket · "+(state.payMedio||"Efectivo")+" · "+money(total));
      state.cart=[]; state.pending=[]; state.order=null; state.table=null; state.mesaAbierta=false;
      saveDB();
      render();
    }

    function imprimirTicket(v){
      const el = $("ticketPrint");
      el.style.display="block";
      el.innerHTML = `
        <h3>EL DESCANSO</h3>
        <div style="text-align:center">Resto-Bar</div>
        <div style="text-align:center">Ticket no fiscal</div>
        <div class="dash"></div>
        <div>Mesa ${v.mesa||"—"} · ${v.pers||1} pers.</div>
        <div>Mozo: ${v.mozo}</div>

      if(state.tab==="stock"){
        $("left").innerHTML = `<div style="display:grid;grid-template-columns:1.2fr .8fr;height:100%">
          <div class="cfg-body">
            <div class="row" style="margin-bottom:8px"><button class="btn btn-light">Control de Stock</button><button class="btn btn-ghost">Movimientos</button><button class="btn btn-dark">Importar Stock</button></div>
            <p class="muted">Disponibles · Poco stock · Agotados · Sin stock definido</p>
            <table class="grid"><tr><th>Producto</th><th>Stock</th><th>Disponibles</th></tr>
            ${stockItems.map(s=>`<tr class="${s[2]==="no"?"sideline":""}"><td>${s[0]}</td><td>${s[1]==null?"-":s[1]+" unid."}</td><td style="color:${s[1]>0?"#1a8a3a":"#c44"}">${s[1]==null?"-":s[1]+" unid."}</td></tr>`).join("")}</table>
          </div><div class="empty-right">&lt; Selecciona un item del listado</div></div>`;
        return;
      }
      if(state.tab==="menus"){
        $("left").innerHTML = `<div class="empty-right" style="flex-direction:column;gap:12px">
          <h2>Menús</h2><p class="muted">Precios y horarios distintos según canal (salón, delivery, pileta).</p>
          <button class="btn btn-orange">+ Nuevo menú</button></div>`;
        return;
      }
      $("left").innerHTML = `<div style="display:grid;grid-template-columns:180px 1fr;height:100%">
        <aside class="side">${catsProd.map(c=>`<button class="item">${c[0]}</button>`).join("")}</aside>
        <div>
          <div class="page-head"><h1>PRODUCTOS</h1>
            <div class="row"><button class="btn btn-dark">Ordenar</button><button class="btn btn-dark">Modificar precios</button><button class="btn btn-orange">Cargar menú</button><button class="btn btn-dark">+ Nuevo producto</button></div>
          </div>
          <div class="filters"><input class="search" placeholder="Buscar en todas las categorías" /></div>
          <table class="grid"><tr><th>Cód.</th><th>Producto</th><th>Costo</th><th>Margen $</th><th>Margen %</th><th>Markup %</th><th>Precio</th></tr></table>
        </div></div>`;
    }

    function renderGastos(){
      $("ws").classList.add("full"); $("right").innerHTML="";
      if(state.tab==="cats"){
        $("left").innerHTML = `<div style="display:grid;grid-template-columns:1.3fr .7fr;height:100%">
          <div class="cfg-body">
            <div class="row" style="margin-bottom:10px"><input class="search" placeholder="Buscar" /><button class="btn btn-orange">+ Nueva categoría</button></div>
            <table class="grid"><tr><th>Nombre</th><th>Categoría financiera</th></tr>
            ${[["Artículos de oficina","Gastos administrativos"],["Compras y proveedores","Compra de mercadería"],["Empleados","Gastos operacionales"],["Limpieza y manutención","Gastos administrativos"],["Marketing y publicidad","Gastos operacionales"],["Servicios","Gastos operacionales"],["Servicios contables","Gastos administrativos"],["Software","Gastos administrativos"]].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}
            </table>
          </div><div class="empty-right">Selecciona una categoría para más detalles</div></div>`;
        return;
      }
      $("left").innerHTML = `<div style="display:grid;grid-template-columns:1.3fr .7fr;height:100%">
        <div class="cfg-body">
          <div class="row" style="margin-bottom:10px"><button class="btn btn-light">Exportar</button><button class="btn btn-light">Importar</button><button class="btn btn-orange">+ Nuevo gasto</button></div>
          <div class="card">Registros <b>0</b> · Total $ 0,00</div>
          <table class="grid"><tr><th>Fecha de registro</th><th>Fecha</th><th>Proveedor</th><th>Categoría</th><th>Comentario</th><th>Importe</th></tr></table>
        </div><div class="empty-right">Selecciona un gasto para más detalles</div></div>`;
    }

    function renderFinanzas(){
      $("ws").classList.add("full"); $("right").innerHTML="";
      const pages = {
        cobrar: `<div class="cfg-body"><p class="muted">CUENTAS A COBRAR</p><h2>Control de cobros digitales</h2>
          <p>Getnet y Mercado Pago: neto cobrado, comisiones y fecha de acreditación.</p>
          <div class="card">Ejemplo: Getnet cobrado $1.350,40 · MP pendiente $1.575</div></div>`,
        eeff: `<div class="cfg-body"><h2>Estado de resultados</h2>
          <div class="card"><b>Análisis financiero</b><p>Ventas, CMV, margen bruto, descuentos, impuestos y gastos — comparado contra el período anterior.</p></div></div>`,
        bancos: `<div style="display:grid;grid-template-columns:1.3fr .7fr;height:100%">
          <div class="cfg-body"><div class="row" style="margin-bottom:10px"><button class="btn btn-light">Nueva transferencia</button><button class="btn btn-orange">+ Nueva cuenta</button></div>
          <table class="grid"><tr><th>Nombre</th><th>Banco</th><th>N° de cuenta</th></tr><tr><td>Caja física</td><td></td><td>—</td></tr></table></div>
          <div class="empty-right">Seleccioná una cuenta para ver los detalles</div></div>`,
        flujo: `<div class="cfg-body"><p class="muted">FLUJO DE CAJA</p><h2>Anticipá cuánto dinero vas a tener disponible</h2>
          <div class="card">Gastos $58.000 · Ingresos $81.000 · Saldo $25.000 · Transferencias $2.000 <span class="muted">(ejemplo de la captura)</span></div></div>`
      };
      $("left").innerHTML = pages[state.tab] || pages.cobrar;
    }

    loadDB();
    if(/Mobi|Android|iPhone/i.test(navigator.userAgent) || location.hash==="#mozo"){
      abrirMozo();
    } else {
      render();
    }
  </script>
</body>
</html>
